[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mediflow"
version = "1.0.0"
description = "Healthcare ETL pipeline and star-schema data warehouse (Airflow, PostgreSQL, Docker)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "SQLAlchemy>=1.4.36",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
mediflow = "mediflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
